      - name: Patch homepage and root layout safely
        run: node scripts/install-phase2-website.mjs
      - name: Static Phase 2 contract
        run: node scripts/check-phase2-website.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
      - name: Protect environment and workflow files
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '^\.env($|\.)'
          ! git diff --name-only | grep -E '^\.github/workflows/'
      - name: Commit verified Phase 2 website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Phase 2 Installer"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add app components lib scripts
          if git diff --cached --quiet; then echo "Phase 2 website is already installed."; exit 0; fi
          git commit -m "Install LoadLink Phase 2 driver profiles"
          git push origin HEAD:main
      - name: Summary
        if: always()
        run: |
          echo "## LoadLink Phase 2 Website" >> "$GITHUB_STEP_SUMMARY"
          echo "- Driver profile form and critical-document validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drivers Available for Work homepage section" >> "$GITHUB_STEP_SUMMARY"
          echo "- Marketplace-only restriction guard" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing environment variables and workflows preserved" >> "$GITHUB_STEP_SUMMARY"
