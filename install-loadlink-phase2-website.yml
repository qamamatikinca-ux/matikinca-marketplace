name: Install LoadLink Phase 2 Website

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-phase2-website
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify current website baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/page.tsx
          test -f app/layout.tsx
          test -f app/globals.css
      - name: Create rollback artifact
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-phase2-website.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-phase2-website
          path: ${{ runner.temp }}/loadlink-before-phase2-website.zip
          retention-days: 30
      - name: Decode verified Phase 2 website payload
        shell: bash
        run: |
          set -euo pipefail
