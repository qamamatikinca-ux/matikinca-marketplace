name: Install LoadLink Homepage and Driver Final Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadlink-homepage-driver-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.loadlink-backups \
            -czf /tmp/loadlink-before-homepage-driver-final.tar.gz .

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-homepage-driver-final-${{ github.run_number }}
          path: /tmp/loadlink-before-homepage-driver-final.tar.gz
          retention-days: 30

      - name: Apply verified LoadLink repair
