      - name: Verify the requested source changes
        shell: bash
        run: |
          set -euo pipefail

          test -f public/images/driver-profile-hero.jpg
          test -f components/LoadLinkPagination.tsx
          test -f components/LoadLinkThemeToggle.tsx
          test -f app/dealership/loadlink-commercial-centurion/page.tsx
          test ! -d app/trucks
          test ! -d app/available-trucks
          test ! -d app/network

          grep -Fq 'title: "Driver Profile"' app/page.tsx
          grep -Fq '/images/driver-profile-hero.jpg' app/page.tsx
          grep -Fq 'Continue as guest' components/SiteMenu.tsx
          grep -Fq 'select("avatar_url,full_name")' components/SiteMenu.tsx
          grep -Fq '[1, 2, 3, 4, 5, 6, "…", total]' components/LoadLinkPagination.tsx
          grep -Fq 'Customize showroom' components/LoadLinkCommercialDealership.tsx
          grep -Fq 'selected' components/LoadLinkCommercialDealership.tsx
          grep -Fq 'return supabase' lib/phase2/supabase.ts
          grep -Fq 'LoadLinkThemeToggle' app/account/settings/page.tsx
          grep -Fq 'LoadLinkThemeToggle' app/jobs/page.tsx
          grep -Fq 'LoadLinkThemeToggle' app/my-posts/page.tsx
          grep -Fq 'LoadLinkThemeToggle' app/dealer/page.tsx

          if grep -E 'FeaturedDealership|FollowedNetwork|Available Trucks|Your LoadLink network|LoadLink Commercial Centurion' app/page.tsx; then
            echo 'Unapproved homepage content is still present.' >&2
            exit 1
          fi

          if grep -RIn --include='*.ts' --include='*.tsx' '/trucks' app components lib; then
            echo 'The removed Available Trucks route is still referenced.' >&2
            exit 1
          fi

          if grep -RIn --include='*.ts' --include='*.tsx' -E 'MISSING NEXT_PUBLIC_SUPABASE_URL|Missing NEXT_PUBLIC_SUPABASE_URL' app components lib; then
            echo 'The old driver-profile Supabase error is still present.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Type-check website
        shell: bash
        run: npx tsc --noEmit

      - name: Build production website
        shell: bash
        run: npm run build

      - name: Smoke-test homepage, driver profile and dealership
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 > /tmp/loadlink-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ > /tmp/loadlink-home.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3100/driver-profile > /tmp/loadlink-driver.html
          curl -fsS http://127.0.0.1:3100/dealership/loadlink-commercial-centurion > /tmp/loadlink-dealer.html

          grep -Fq 'Driver Profile' /tmp/loadlink-home.html
          if grep -E 'Available Trucks|Your LoadLink network|LoadLink Commercial Centurion' /tmp/loadlink-home.html; then
            echo 'Unapproved homepage content rendered during the smoke test.' >&2
            exit 1
          fi

          trucks_status=$(curl -sS -o /tmp/loadlink-trucks.html -w '%{http_code}' http://127.0.0.1:3100/trucks)
          if [ "$trucks_status" != '404' ]; then
            echo "Expected /trucks to be removed, but it returned HTTP $trucks_status." >&2
            exit 1
          fi

      - name: Commit only after every check passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LoadLink Installer'
          git config user.email 'loadlinksouthafrica@gmail.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'The requested repair is already installed.'
            exit 0
          fi

          git commit -m 'Fix homepage, driver profile and shared LoadLink UI'
          git push origin "HEAD:${{ github.ref_name }}"
