name: LoadLink final UI 2026-08-15

on:
  push:
    branches:
      - loadlink-final-ui-20260815
    paths:
      - '.github/workflows/loadlink-final-ui-20260815.yml'

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: loadlink-final-ui-20260815
          fetch-depth: 0

      - name: Apply exact UI corrections
        run: python3 .github/loadlink-final-ui-20260815.py

      - name: Install dependencies
        run: npm ci

      - name: Production build check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "LoadLink Release Bot"
          git config user.email "loadlink-release@users.noreply.github.com"
          git add app/page.tsx app/jobs/page.tsx app/list-your-vehicle/page.tsx app/tools/truck-finance/page.tsx app/messages/page.tsx app/globals.css components/GlobalLoading.tsx components/LoadLinkUiRepairV273.tsx components/SouthAfricaLocationInput.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply final verified LoadLink UI corrections"
          git push origin HEAD:loadlink-final-ui-20260815
