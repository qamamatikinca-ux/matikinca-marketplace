name: LoadLink Responsive Experience Check

on:
  push:
    branches:
      - loadlink-responsive-experience-20260813

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify responsive update files
        run: |
          test -f app/loadlink-responsive-experience.css
          test -f public/images/loadlink-login-hero-hd.jpeg
          grep -q 'loadlink-responsive-experience.css' app/layout.tsx
          grep -q 'data-loadlink-datalist-menu' components/LoadLinkInteractionSystem.tsx
          grep -q 'data-loadlink-choice-sheet' components/LoadLinkInteractionSystem.tsx
          grep -q 'loadlink-login-hero-hd.jpeg' components/AuthLandingShell.tsx
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
