name: Verify final LoadLink portal alignment

on:
  push:
    branches:
      - main
    paths:
      - "scripts/align-vehicle-portal-with-driver.py"
      - ".github/workflows/apply-final-loadlink-regressions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-final-loadlink-portal-alignment
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align vehicle portal to Driver Portal structure
        run: python scripts/align-vehicle-portal-with-driver.py

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Commit verified alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Portal Alignment"
          git config user.email "actions@users.noreply.github.com"
          git add app/list-your-vehicle/page.tsx
          if git diff --cached --quiet; then
            echo "No alignment changes were required."
            exit 0
          fi
          git commit -m "fix: make vehicle portal follow approved driver portal structure"
          git push origin HEAD:main
