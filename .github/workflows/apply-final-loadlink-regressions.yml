name: Apply final LoadLink regression repair

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fix-final-loadlink-regressions.py"
      - ".github/workflows/apply-final-loadlink-regressions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-loadlink-regressions
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted regression repair
        run: python scripts/fix-final-loadlink-regressions.py

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Commit verified application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Regression Repair"
          git config user.email "actions@users.noreply.github.com"
          git add components/MarketplaceDiscovery.tsx app/list-your-vehicle/page.tsx components/SiteMenu.tsx app/tools/page.tsx
          if git diff --cached --quiet; then
            echo "No application changes were required."
            exit 0
          fi
          git commit -m "fix: restore approved LoadLink portal behavior and vehicle flow"
          git push origin HEAD:main
