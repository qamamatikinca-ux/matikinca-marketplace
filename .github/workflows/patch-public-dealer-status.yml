name: Wire public Dealer Status

on:
  push:
    branches: [fix/dealer-dashboard-simple]
    paths: [.github/workflows/patch-public-dealer-status.yml]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dealer-dashboard-simple
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Patch public dealership page
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/dealership/[slug]/page.tsx')
          s=p.read_text()
          old='import SiteMenu from "@/components/SiteMenu";\nimport { supabase } from "@/lib/supabaseClient";'
          new='import SiteMenu from "@/components/SiteMenu";\nimport PublicDealerStatus from "@/components/dealer/PublicDealerStatus";\nimport { supabase } from "@/lib/supabaseClient";'
          if s.count(old)!=1: raise SystemExit(f'import anchor mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          anchor='</section>\n\n      {updates.length ? <section'
          inject='</section>\n\n      <PublicDealerStatus dealerId={dealer.id} dealerSlug={dealer.slug} darkMode={darkMode} />\n\n      {updates.length ? <section'
          if s.count(anchor)!=1: raise SystemExit(f'content anchor mismatch: {s.count(anchor)}')
          s=s.replace(anchor,inject,1)
          p.write_text(s)
          PY
          grep -q 'PublicDealerStatus dealerId={dealer.id}' 'app/dealership/[slug]/page.tsx'
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Commit verified patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-public-dealer-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/dealership/[slug]/page.tsx' .github/workflows/patch-public-dealer-status.yml
          git commit -m "Show and track Dealer Status on public showroom"
          git push origin HEAD:fix/dealer-dashboard-simple
