name: LoadLink Manual Primary Deploy

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Create a fresh production deployment commit"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/loadlink-manual-zip-update-deploy.yml"

permissions:
  contents: write
  statuses: read

concurrency:
  group: loadlink-manual-primary-deploy
  cancel-in-progress: false

jobs:
  build-push-verify:
    name: Build current main, push primary deploy, verify Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PRIMARY_VERCEL_CONTEXT: "Vercel – matikinca-marketplace"

    steps:
      - name: Checkout current LoadLink main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify primary-only Vercel routing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "qamamatikinca-ux/matikinca-marketplace"
          test -f package.json
          test -f package-lock.json
          test -f vercel.json
          grep -Fq "matikinca-marketplace.vercel.app" vercel.json
          echo "Primary-only Vercel routing: PASS"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Create manual production deployment commit
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git commit --allow-empty -m "deploy: manual primary LoadLink production [run $GITHUB_RUN_NUMBER]"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push deployment commit to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Remote main verification: PASS"

      - name: Wait for primary Vercel production status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -Eeuo pipefail
          echo "Waiting for primary Vercel status on $DEPLOY_SHA"

          for attempt in $(seq 1 40); do
            STATUS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/status")"
            STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg ctx "$PRIMARY_VERCEL_CONTEXT" '.statuses[] | select(.context == $ctx) | .state' | head -n1)"
            DESCRIPTION="$(printf '%s' "$STATUS_JSON" | jq -r --arg ctx "$PRIMARY_VERCEL_CONTEXT" '.statuses[] | select(.context == $ctx) | .description' | head -n1)"
            TARGET_URL="$(printf '%s' "$STATUS_JSON" | jq -r --arg ctx "$PRIMARY_VERCEL_CONTEXT" '.statuses[] | select(.context == $ctx) | .target_url' | head -n1)"

            if [ -z "$STATE" ]; then
              echo "[$attempt/40] Primary Vercel has not reported yet."
              sleep 5
              continue
            fi

            echo "Primary Vercel state: $STATE"
            echo "Primary Vercel message: ${DESCRIPTION:-none}"
            echo "Primary Vercel target: ${TARGET_URL:-none}"

            case "$STATE" in
              success)
                echo "Primary LoadLink production deployment completed successfully."
                exit 0
                ;;
              failure|error)
                echo "::error::Primary Vercel rejected deployment: ${DESCRIPTION:-unknown Vercel error}"
                exit 1
                ;;
              pending)
                sleep 5
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "::error::Timed out waiting for primary Vercel production deployment."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "## LoadLink manual primary deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: qamamatikinca-ux/matikinca-marketplace" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment commit: \`${DEPLOY_SHA:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: primary matikinca-marketplace Vercel project only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build must pass before deployment commit is pushed" >> "$GITHUB_STEP_SUMMARY"

# Manual workflow trigger: corrected vehicle portal production deployment.
