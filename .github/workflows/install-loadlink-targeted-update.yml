      - name: Verify targeted update contract
        shell: bash
        run: |
          set -euo pipefail
          test -f 'app/layout.tsx'
          test -f 'app/globals.css'
          test -f 'app/account/packages/page.tsx'
          test -f 'app/account/settings/page.tsx'
          test -f 'app/dealer/page.tsx'
          test -f 'app/dealership/[slug]/page.tsx'
          test -f 'app/list-your-truck/page.tsx'
          test -f 'app/list-your-vehicle/page.tsx'
          test -f 'app/messages/page.tsx'
          test -f 'app/my-posts/page.tsx'
          test -f 'app/page.tsx'
          test -f 'components/BusinessPlans.tsx'
          test -f 'components/ChatLauncher.tsx'
          test -f 'components/GlobalLoading.tsx'
          test -f 'components/LoadLinkCommercialDealership.tsx'
          test -f 'components/MarketplaceDiscovery.tsx'
          test -f 'components/SiteMenu.tsx'
          test -f 'components/ThemeCoordinator.tsx'
          grep -q 'SAFETY_MAXIMUM_LOADING_TIME' components/GlobalLoading.tsx
          grep -q 'snap-mandatory' components/LoadLinkCommercialDealership.tsx
          grep -q 'Swipe products' 'app/dealership/[slug]/page.tsx'
          grep -q 'Create dealership post' app/dealer/page.tsx
          grep -q 'loadlink-messages' app/messages/page.tsx
          grep -q 'createPortal' components/SiteMenu.tsx
          grep -q 'const trailerTypes = \["Flatbed"' app/list-your-vehicle/page.tsx
          grep -q 'const mobileUnitTypes = \["Mobile Toilet"' app/list-your-vehicle/page.tsx
          grep -q 'savePreference' app/account/settings/page.tsx
          if grep -RIn --include='*.ts' --include='*.tsx' 'List Your Truck' app components lib; then
            echo 'Old List Your Truck wording remains.'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production build
        run: npm run build

      - name: Commit and deploy update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'app/layout.tsx' 'app/globals.css' 'app/account/packages/page.tsx' 'app/account/settings/page.tsx' 'app/dealer/page.tsx' 'app/dealership/[slug]/page.tsx' 'app/list-your-truck/page.tsx' 'app/list-your-vehicle/page.tsx' 'app/messages/page.tsx' 'app/my-posts/page.tsx' 'app/page.tsx' 'components/BusinessPlans.tsx' 'components/ChatLauncher.tsx' 'components/GlobalLoading.tsx' 'components/LoadLinkCommercialDealership.tsx' 'components/MarketplaceDiscovery.tsx' 'components/SiteMenu.tsx' 'components/ThemeCoordinator.tsx'
          if git diff --cached --quiet; then
            echo "The targeted update is already installed."
          else
            git commit -m "Install LoadLink dealership, messages and vehicle update"
            git push origin main
          fi
