name: Deploy LoadLink b4sf Final Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-loadlink-b4sf-final.yml'

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_ltBsujLbhqOPqX4dlpWDHial
  VERCEL_PROJECT_ID: prj_vkKr08egoWmA7XCmUKruj2zjiBi4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN or VERCEL_ACCESS_TOKEN repository secret is available."
            exit 2
          fi
      - name: Deploy exact main tree to LoadLink b4sf production
        run: npx --yes vercel@latest --prod --yes --token="$VERCEL_TOKEN"
