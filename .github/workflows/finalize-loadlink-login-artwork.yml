name: Finalize LoadLink login artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-loadlink-login-artwork.yml'
      - '.github/login-artwork-v3/**'
      - 'scripts/finalize-login-artwork.mjs'

permissions:
  contents: write

jobs:
  finalize-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and verify artwork
        run: node scripts/finalize-login-artwork.mjs

      - name: Verify committed production asset
        shell: bash
        run: |
          test "$(wc -c < public/images/loadlink-login-hero-hd.webp | tr -d ' ')" = "136014"
          test "$(sha256sum public/images/loadlink-login-hero-hd.webp | awk '{print $1}')" = "aa8633917fc45b724cb82c92f3d7281a29aa4ef20d487744942467867926a6cd"
          file public/images/loadlink-login-hero-hd.webp

      - name: Commit verified binary to main
        shell: bash
        run: |
          if git diff --quiet -- public/images/loadlink-login-hero-hd.webp; then
            echo "Verified artwork is already committed."
            exit 0
          fi
          git config user.name "LoadLink Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/loadlink-login-hero-hd.webp
          git commit -m "Store verified LoadLink login artwork [skip ci]"
          git push origin HEAD:main
