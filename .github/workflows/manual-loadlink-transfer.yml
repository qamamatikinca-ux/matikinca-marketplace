name: Manual LoadLink transfer bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-loadlink-transfer.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Prepare transfer archive
        shell: bash
        run: |
          tar --exclude='.git' --exclude='.github/workflows/manual-loadlink-transfer.yml' --exclude='package.json' --exclude='package-lock.json' -czf /tmp/loadlink-source.tgz .
          cp package.json /tmp/package.json
          cp package-lock.json /tmp/package-lock.json
      - name: Upload transfer payload
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-manual-transfer
          path: |
            /tmp/loadlink-source.tgz
            /tmp/package.json
            /tmp/package-lock.json
          if-no-files-found: error
          retention-days: 1
