name: Install LoadLink Phase 2 Final

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-phase2-final
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify LoadLink baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/page.tsx
          test -f app/messages/page.tsx
          test -f app/jobs/page.tsx
          test -f components/AuthStatusButton.tsx

      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-phase2-final.zip" HEAD

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-phase2-final
          path: ${{ runner.temp }}/loadlink-before-phase2-final.zip
          retention-days: 30

      - name: Install verified Phase 2 files
