      - name: Verify required Phase 2 features
        shell: bash
        run: |
          set -euo pipefail
          test -f components/SiteMenu.tsx
          test -f app/account/settings/page.tsx
          test -f app/signup/page.tsx
          test -f LOADLINK-PHASE-2-FINAL.sql
          grep -q 'SiteMenu' app/page.tsx
          grep -q 'DriversAvailableForWork' app/page.tsx
          grep -q 'SiteMenu' app/messages/page.tsx
          grep -q 'MediaRecorder' app/messages/page.tsx
          grep -qi 'block' app/messages/page.tsx
          grep -q 'LISTINGS_PER_PAGE = 7' app/jobs/page.tsx
          grep -q 'POSTS_PER_PAGE = 7' app/my-posts/page.tsx
          grep -q 'POSTS_PER_PAGE=7' app/dealer/page.tsx
          grep -q 'POSTS_PER_PAGE=7' 'app/dealership/[slug]/page.tsx'
          grep -q 'PAGE_SIZE = 7' app/dealership/truckstore-centurion-demo/page.tsx
          grep -q 'PAGE_SIZE = 7' components/phase2/DriversAvailableForWork.tsx
          test -f app/dealership/truckstore-centurion-demo/page.tsx
          python3 - <<'PYVERIFY'
          from pathlib import Path
          page = Path('app/page.tsx').read_text()
          drivers = page.find('<DriversAvailableForWork')
          footer = page.find('<footer')
          if drivers < 0 or footer < 0 or drivers > footer:
              raise SystemExit('Driver section is not positioned before the footer.')
          print('Phase 2 feature verification passed.')
          PYVERIFY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production build
        run: npm run build

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Phase 2 files are already installed."
            exit 0
          fi
          git commit -m "Install LoadLink Phase 2 final update"
          git push
