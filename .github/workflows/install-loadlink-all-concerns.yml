      - name: Validate requested update coverage
        shell: bash
        run: |
          set -euo pipefail
          test -f app/list-your-vehicle/page.tsx
          grep -Fq 'SAFETY_MAXIMUM_LOADING_TIME' components/GlobalLoading.tsx
          grep -Fq 'snap-x snap-mandatory' components/LoadLinkCommercialDealership.tsx
          grep -Fq 'snap-x snap-mandatory' 'app/dealership/[slug]/page.tsx'
          grep -Fq 'Add a product post' app/dealer/page.tsx
          grep -Fq 'Previous owners' 'app/dealership/[slug]/page.tsx'
          grep -Fq 'loadlink-messages' app/messages/page.tsx
          grep -Fq 'createPortal' components/SiteMenu.tsx
          grep -Fq 'savePreference' app/account/settings/page.tsx
          grep -Fq 'Are you a dealership?' app/list-your-vehicle/page.tsx
          grep -Fq 'Flatbed' app/list-your-vehicle/page.tsx
          grep -Fq 'Mobile Toilet' app/list-your-vehicle/page.tsx
          grep -Fq 'window.location.replace' app/list-your-truck/page.tsx
          echo "All requested feature markers are present." | tee /tmp/loadlink-validation.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/loadlink-npm-ci.log

      - name: TypeScript validation
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/loadlink-typescript.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/loadlink-build.log

      - name: Commit targeted update
        shell: bash
        run: |
          set -euo pipefail
          git add --             app/account/packages/page.tsx             app/account/settings/page.tsx             app/dealer/page.tsx             'app/dealership/[slug]/page.tsx'             app/globals.css             app/layout.tsx             app/list-your-truck/page.tsx             app/list-your-vehicle/page.tsx             app/messages/page.tsx             app/my-posts/page.tsx             app/page.tsx             components/BusinessPlans.tsx             components/ChatLauncher.tsx             components/GlobalLoading.tsx             components/LoadLinkCommercialDealership.tsx             components/LoadLinkLoading.tsx             components/MarketplaceDiscovery.tsx             components/SiteMenu.tsx             components/ThemeCoordinator.tsx             lib/useLoadLinkTheme.ts
          if git diff --cached --quiet; then
            echo "The targeted update is already installed."
            exit 0
          fi
          git commit -m "Fix LoadLink dealership, messages, menu, theme and vehicle listing"
          git push origin HEAD:main

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-all-concerns-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/loadlink-backup.txt
            /tmp/loadlink-validation.txt
            /tmp/loadlink-npm-ci.log
            /tmp/loadlink-typescript.log
            /tmp/loadlink-build.log
