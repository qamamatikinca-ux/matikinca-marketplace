name: Install LoadLink All Concerns Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadlink-all-concerns-update
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create rollback branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Update Bot"
          git config user.email "loadlinksouthafrica@gmail.com"
          BACKUP_BRANCH="backup/loadlink-before-all-concerns-${{ github.run_id }}"
          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"
          echo "Backup created: $BACKUP_BRANCH" | tee /tmp/loadlink-backup.txt

