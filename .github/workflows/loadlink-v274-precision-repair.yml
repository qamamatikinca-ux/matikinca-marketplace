name: LoadLink V2.7.4 Precision Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loadlink-v274-precision-repair.yml'

permissions:
  contents: write

jobs:
  repair-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply precision repairs
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/messages/page.tsx app/packages/page.tsx components/dealer/DealerShell.tsx components/ChatLauncher.tsx components/LogisticsMessageTools.tsx components/LoadLinkUiRepairV273.tsx
          git diff --cached --check
          git commit -m "LoadLink V2.7.4 precision header messages dealer repair"
          git push origin HEAD:main

      - name: Package update only
        run: |
          rm -rf /tmp/loadlink-v274-update
          mkdir -p /tmp/loadlink-v274-update
          for f in app/page.tsx app/messages/page.tsx app/packages/page.tsx components/dealer/DealerShell.tsx components/ChatLauncher.tsx components/LogisticsMessageTools.tsx components/LoadLinkUiRepairV273.tsx; do
            mkdir -p "/tmp/loadlink-v274-update/$(dirname "$f")"
            cp "$f" "/tmp/loadlink-v274-update/$f"
          done
          printf '%s\n' 'LoadLink V2.7.4 precision repair — UPDATE ONLY' 'True-centred headers, Messages hero, plan-aware packages, dealer/chat layering, logistics portal.' > /tmp/loadlink-v274-update/README-V2.7.4.txt
          cd /tmp/loadlink-v274-update
          zip -r /tmp/LoadLink-V2.7.4-UPDATE-ONLY.zip .
          cp /tmp/LoadLink-V2.7.4-UPDATE-ONLY.zip "$GITHUB_WORKSPACE/LoadLink-V2.7.4-UPDATE-ONLY.zip"

      - name: Upload update-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LoadLink-V2.7.4-UPDATE-ONLY
          path: LoadLink-V2.7.4-UPDATE-ONLY.zip
          if-no-files-found: error
          retention-days: 7
