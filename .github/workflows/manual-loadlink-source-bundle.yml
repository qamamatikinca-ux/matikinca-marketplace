name: Bundle LoadLink source for manual Vercel deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-loadlink-source-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-manual-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Record bundle run id
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/manual-bundle-run.txt
          printf '%s\n' "${GITHUB_SHA}" >> .github/manual-bundle-run.txt
          git config user.name "LoadLink Manual Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add .github/manual-bundle-run.txt
          git commit -m "Record manual source bundle run [skip ci]"
          git push origin HEAD:main
