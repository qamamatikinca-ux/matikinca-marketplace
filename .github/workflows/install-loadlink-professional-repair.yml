      - name: Verify requested website corrections
        shell: bash
        run: |
          set -euo pipefail
          test -f app/dealership/loadlink-commercial-centurion/page.tsx
          test -f components/LoadLinkCommercialDealership.tsx
          test -f components/FollowedNetwork.tsx
          test -f LOADLINK-PROFESSIONAL-REPAIR.txt
          grep -q 'Drivers Available' app/page.tsx
          grep -q '/images/jobs/hero.jpg' app/page.tsx
          grep -q 'Your LoadLink network' components/FollowedNetwork.tsx
          grep -q 'New vehicle listings' components/LoadLinkCommercialDealership.tsx
          grep -q 'Dealership updates' components/LoadLinkCommercialDealership.tsx
          grep -q 'Price changes' components/LoadLinkCommercialDealership.tsx
          grep -q 'SettingsGearIcon' components/AuthStatusButton.tsx
          grep -q 'useState(false)' components/NotificationCenter.tsx
          grep -q 'SAFETY_MAXIMUM_LOADING_TIME = 5000' components/GlobalLoading.tsx
          grep -q 'jobs in Gauteng' components/MarketplaceDiscovery.tsx
          grep -q 'detectRegion' app/jobs/page.tsx
          grep -q 'selectedPlan ? <form' app/list-your-truck/page.tsx
          ! grep -q 'BuyATruckShowcase' app/list-your-truck/page.tsx
          ! grep -qi 'Account verification' app/page.tsx
          ! grep -q 'Mission information will be added here later' app/page.tsx
          grep -q 'loadlink-rejection-panel' app/my-posts/page.tsx
          grep -q 'ThemeCoordinator' app/layout.tsx
          grep -q 'SiteMenu' app/list-your-truck/page.tsx
          grep -q '/images/jobs/hero.jpg' components/phase2/DriversAvailableForWork.tsx
          ! grep -q 'phase2-driver-profile.module.css' app/driver-profile/page.tsx

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build

      - name: Protect environment and workflow files
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '^\.env($|\.)'
          ! git diff --name-only | grep -E '^\.github/workflows/'

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Professional Repair"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add -A app components lib LOADLINK-PROFESSIONAL-REPAIR.txt
          if git diff --cached --quiet; then
            echo "The professional repair is already installed."
            exit 0
          fi
          git commit -m "Repair LoadLink professional experience"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Installation summary
        if: always()
        run: |
          echo "## LoadLink Professional Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Modern menu and signed-in settings gear" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read notifications hide immediately" >> "$GITHUB_STEP_SUMMARY"
          echo "- Driver portal and driver profile integrated into LoadLink" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan selection occurs before truck selection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Featured dealership, follow preferences and homepage network" >> "$GITHUB_STEP_SUMMARY"
          echo "- Natural-language search and readable rejection feedback" >> "$GITHUB_STEP_SUMMARY"
