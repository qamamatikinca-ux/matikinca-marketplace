name: Install LoadLink Professional Repair

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-professional-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current LoadLink website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected website baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/page.tsx
          test -f app/jobs/page.tsx
          test -f app/list-your-truck/page.tsx
          test -f app/my-posts/page.tsx
          test -f components/NotificationCenter.tsx
          test -f components/AuthStatusButton.tsx

      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-professional-repair.zip" HEAD

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-professional-repair
          path: ${{ runner.temp }}/loadlink-before-professional-repair.zip
          retention-days: 30

      - name: Install professional repair files
