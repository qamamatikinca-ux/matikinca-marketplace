name: LoadLink V2.7.7 UI Recovery

on:
  push:
    branches:
      - recovery/v277-ui-labels

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[v277-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Open repository
        uses: actions/checkout@v4
        with:
          ref: recovery/v277-ui-labels
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply V2.7.7 precision patch
        run: python3 scripts/loadlink-v277-ui-recovery.py

      - name: Install dependencies
        run: npm ci

      - name: Production build validation
        run: npm run build

      - name: Remove recovery scaffolding
        run: |
          rm -f scripts/loadlink-v277-ui-recovery.py
          rm -f .github/workflows/loadlink-v277-ui-recovery.yml

      - name: Commit validated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/LoadLinkSiteHeader.tsx \
            components/LogisticsMessageTools.tsx \
            components/BusinessPlans.tsx \
            app/globals.css \
            scripts/loadlink-v277-ui-recovery.py \
            .github/workflows/loadlink-v277-ui-recovery.yml
          git commit -m "[v277-applied] LoadLink V2.7.7 header tools and label precision"
          git push origin recovery/v277-ui-labels

      - name: Create update-only ZIP
        run: |
          rm -rf /tmp/loadlink-v277-update
          mkdir -p /tmp/loadlink-v277-update/components /tmp/loadlink-v277-update/app
          cp components/LoadLinkSiteHeader.tsx /tmp/loadlink-v277-update/components/
          cp components/LogisticsMessageTools.tsx /tmp/loadlink-v277-update/components/
          cp components/BusinessPlans.tsx /tmp/loadlink-v277-update/components/
          cp app/globals.css /tmp/loadlink-v277-update/app/
          cat > /tmp/loadlink-v277-update/README.txt <<'EOF'
          LoadLink V2.7.7 update only
          - restores the proven shared header geometry
          - fixes chat Logistics Tools layering on iOS/Safari
          - introduces compact LoadLink-brand labels where context benefits
          - keeps LoadLink gold / black / white branding
          EOF
          cd /tmp/loadlink-v277-update
          zip -qr "$GITHUB_WORKSPACE/LoadLink-V2.7.7-UPDATE-ONLY.zip" .

      - name: Upload update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LoadLink-V2.7.7-UPDATE-ONLY
          path: LoadLink-V2.7.7-UPDATE-ONLY.zip
          retention-days: 7
