name: Apply LoadLink V2.7.14 UI Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-loadlink-v2714-ui-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply UI wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Standalone Logistics Tools — use the same professional LoadLink document surface.
          replace_once(
              'app/tools/page.tsx',
              'import LoadLinkSiteHeader from "@/components/LoadLinkSiteHeader";\n',
              'import LoadLinkSiteHeader from "@/components/LoadLinkSiteHeader";\nimport LoadLinkDocumentPreview from "@/components/LoadLinkDocumentPreview";\n',
          )
          replace_once(
              'app/tools/page.tsx',
              '<ToolOutput value={quoteText} darkMode={darkMode} onCopy={()=>void copy(quoteText)} onShare={()=>void share(quoteText)}/>',
              '<div className="grid gap-3"><LoadLinkDocumentPreview darkMode={darkMode} documentType="Rate quote" amount={amount} unit="total" vehicle={vehicle} route={route} availability={availability} vat={vat} terms={terms} /><ToolOutput value={quoteText} darkMode={darkMode} onCopy={()=>void copy(quoteText)} onShare={()=>void share(quoteText)}/></div>',
          )

          # In-chat Logistics Tools — stay in Messages but use the same document layout.
          replace_once(
              'components/LogisticsMessageTools.tsx',
              'import { createPortal } from "react-dom";\n',
              'import { createPortal } from "react-dom";\nimport LoadLinkDocumentPreview from "@/components/LoadLinkDocumentPreview";\n',
          )
          replace_once(
              'components/LogisticsMessageTools.tsx',
              '<label className="text-[10px] font-semibold sm:col-span-2">Terms<input value={terms} onChange={(event) => setTerms(event.target.value)} placeholder="Payment within 7 days of signed POD" className={`mt-1 h-11 w-full rounded-xl border px-3 text-sm font-medium outline-none focus:border-[#f6b800] ${control}`} /></label>\n                <button type="button" disabled={!amount.trim() || disabled || quoteBusy}',
              '<label className="text-[10px] font-semibold sm:col-span-2">Terms<input value={terms} onChange={(event) => setTerms(event.target.value)} placeholder="Payment within 7 days of signed POD" className={`mt-1 h-11 w-full rounded-xl border px-3 text-sm font-medium outline-none focus:border-[#f6b800] ${control}`} /></label>\n                <div className="sm:col-span-2"><LoadLinkDocumentPreview darkMode={darkMode} documentType="Rate quote" amount={amount} unit={unit} vehicle={vehicle} route={route} availability={availability} vat={vat} terms={terms} compact /></div>\n                <button type="button" disabled={!amount.trim() || disabled || quoteBusy}',
          )

          # Job/contract posting — keep existing success flow, add polished LoadLink toast feedback.
          replace_once(
              'app/jobs/list/page.tsx',
              '      setSuccess(true);\n      window.dispatchEvent(new Event("loadlink-account-state-changed"));',
              '      setSuccess(true);\n      window.dispatchEvent(new CustomEvent("loadlink:toast", { detail: { kind: "success", title: `${postNameTitle} submitted`, message: `LoadLink received your ${postName}. You can manage or edit it from My Posts.`, duration: 5200 } }));\n      window.dispatchEvent(new Event("loadlink-account-state-changed"));',
          )

          # Driver documents and profile submission — actual upload/submit code paths.
          replace_once(
              'components/DriverProfileWizardV273.tsx',
              '      setMessage(`${label} uploaded successfully.`);\n      await load(false);',
              '      setMessage(`${label} uploaded successfully.`);\n      window.dispatchEvent(new CustomEvent("loadlink:toast", { detail: { kind: "success", title: `${label} uploaded`, message: "The document is attached to your LoadLink driver profile.", duration: 4800 } }));\n      await load(false);',
          )
          replace_once(
              'components/DriverProfileWizardV273.tsx',
              '      setMessage("Profile submitted. LoadLink has received it for review.");',
              '      setMessage("Profile submitted. LoadLink has received it for review.");\n      window.dispatchEvent(new CustomEvent("loadlink:toast", { detail: { kind: "success", title: "Driver profile submitted", message: "LoadLink received your profile and documents for review.", duration: 5200 } }));',
          )

          # Remove this one-shot installer from the resulting source tree.
          Path('.github/workflows/apply-loadlink-v2714-ui-final.yml').unlink()

      - name: Commit source changes
        run: |
          git config user.name "LoadLink Release Bot"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add -A
          git commit -m "Complete LoadLink V2.7.14 UI wiring"
          git push origin HEAD:main
