name: Install LoadLink Runtime Recovery

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-runtime-recovery
  cancel-in-progress: false

jobs:
  recover-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current LoadLink website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify current LoadLink project
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/layout.tsx
          test -f app/page.tsx
          test -f app/error.tsx
          test -f app/admin/verifications/page.tsx
          test -f components/platform/GlobalEnhancers.tsx
          test -f components/FeaturedDealership.tsx
          test -f components/FollowedNetwork.tsx
          grep -q 'FeaturedDealership' app/page.tsx
          grep -q 'GlobalEnhancers' app/layout.tsx

      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-runtime-recovery.zip" HEAD

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-runtime-recovery
          path: ${{ runner.temp }}/loadlink-before-runtime-recovery.zip
          retention-days: 30

      - name: Decode and verify runtime recovery patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/loadlink-runtime-recovery.b64" <<'LOADLINK_RUNTIME_RECOVERY_PAYLOAD'
