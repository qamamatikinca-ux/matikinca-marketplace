            [[ "$file" =~ $allowed ]] || { echo "Unexpected patch path: $file"; exit 1; }
          done

      - name: Apply isolated runtime repair
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/loadlink-runtime-recovery.tar.gz" -C .
          git diff --check
          test -f components/platform/LoadLinkBoundary.tsx
          grep -q 'Admin workspace' app/admin/page.tsx
          grep -q 'lazy(() => import' components/platform/GlobalEnhancers.tsx
          grep -q 'LoadLink Commercial Centurion' components/FeaturedDealership.tsx

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Run TypeScript verification
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Build production website
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Browser-test homepage and admin routes
        shell: bash
        run: |
          set -euo pipefail

          BROWSER=""
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$BROWSER" || { echo "Chromium browser was not found on the GitHub runner."; exit 1; }

          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/loadlink-next.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/loadlink-next.log"
            exit 1
          fi

          smoke_route() {
            local route="$1"
            local expected="$2"
            local slug
            slug="$(echo "$route" | tr '/?' '__')"
            local dom="$RUNNER_TEMP/dom-${slug:-home}.html"
            local profile="$RUNNER_TEMP/chrome-${slug:-home}-$RANDOM"

            timeout 50s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --user-data-dir="$profile" \
              --virtual-time-budget=15000 \
              --dump-dom "http://127.0.0.1:3000$route" > "$dom"

            grep -Fq "$expected" "$dom" || {
              echo "Expected text was missing on $route: $expected"
              sed -n '1,220p' "$dom"
              cat "$RUNNER_TEMP/loadlink-next.log"
              exit 1
            }

            if grep -Eqi 'This page could not finish loading|Something interrupted this page|LOADLINK RECOVERY' "$dom"; then
              echo "Recovery screen was detected on $route"
              sed -n '1,220p' "$dom"
              cat "$RUNNER_TEMP/loadlink-next.log"
              exit 1
            fi
          }

          smoke_route "/" "LoadLink Commercial Centurion"
          smoke_route "/admin" "Admin workspace"
          smoke_route "/admin/verifications" "Verification reviews"

      - name: Commit verified recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Installer"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add \
            app/layout.tsx \
            app/page.tsx \
            app/admin/page.tsx \
            lib/useLoadLinkTheme.ts \
            components/SiteMenu.tsx \
            components/ThemeCoordinator.tsx \
            components/FollowedNetwork.tsx \
            components/AuthStatusButton.tsx \
            components/platform/LoadLinkBoundary.tsx \
            components/platform/GlobalEnhancers.tsx

          if git diff --cached --quiet; then
            echo "The verified runtime recovery is already installed."
            exit 0
          fi

          git commit -m "Stabilize LoadLink browser runtime"
          git push
