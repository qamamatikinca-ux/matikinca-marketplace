name: LoadLink audit repair

on:
  push:
    paths:
      - .github/workflows/loadlink-audit-repair.yml
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' || github.event.issue.title == '[LoadLink Repair] Run core audit patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair reporting and account-owned listing controls
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/jobs/page.tsx")
          text = path.read_text()

          replacements = []

          replacements.append((
          '''function reportListing(job: JobListing) {
            const reason = window.prompt("Briefly explain why you are reporting this listing.");
            if (!reason?.trim()) return;
            try {
              const reports = JSON.parse(localStorage.getItem("loadlink-pending-reports") || "[]");
              const next = [{ listingId: job.id, title: job.title, reason: reason.trim(), createdAt: new Date().toISOString() }, ...(Array.isArray(reports) ? reports : [])];
              localStorage.setItem("loadlink-pending-reports", JSON.stringify(next));
              window.alert("Report saved. It will be sent when the complaints email connection is added.");
            } catch {
              window.alert("The report could not be saved on this device.");
            }
          }''',
          '''async function reportListing(job: JobListing) {
            const reason = window.prompt("Briefly explain why you are reporting this listing.");
            const cleanReason = reason?.trim() || "";
            if (!cleanReason) return;
            if (cleanReason.length < 8) {
              window.alert("Please add a little more detail so LoadLink can review the report properly.");
              return;
            }
            if (!isSupabaseConfigured) {
              window.alert("Reporting is temporarily unavailable. Please try again shortly.");
              return;
            }

            const { data: authData, error: authError } = await supabase.auth.getUser();
            if (authError || !isAuthenticatedUser(authData.user)) {
              window.alert("Sign in to submit a report to LoadLink.");
              const next = `${window.location.pathname}${window.location.search}${window.location.hash}`;
              window.location.href = `/login?next=${encodeURIComponent(next)}`;
              return;
            }

            const { data, error } = await supabase.rpc("loadlink_create_moderation_case", {
              p_entity_type: "listing",
              p_entity_id: job.id,
              p_reason: cleanReason,
              p_case_type: "report",
              p_evidence: [],
            });

            if (error) {
              window.alert(error.message || "The report could not be submitted. Please try again.");
              return;
            }

            const result = Array.isArray(data) ? data[0] : data;
            const caseNumber = result && typeof result === "object" ? String((result as { case_number?: string }).case_number || "") : "";
            window.alert(caseNumber ? `Report submitted to LoadLink. Reference ${caseNumber}.` : "Report submitted to LoadLink.");
          }'''))

          replacements.append((
          '''  const [sortMode, setSortMode] = useState<JobSortMode>("newest");''',
          '''  const [sortMode, setSortMode] = useState<JobSortMode>("newest");
            const [viewerUserId, setViewerUserId] = useState("");'''))

          replacements.append((
          '''    setOwnedJobs(locallyOwnedJobs);
            setLikedJobIds(getLikedJobIds());

            if (isSupabaseConfigured && Object.keys(locallyOwnedJobs).length > 0) {''',
          '''    setOwnedJobs(locallyOwnedJobs);
            setLikedJobIds(getLikedJobIds());

            if (isSupabaseConfigured) {
              supabase.auth.getUser()
                .then(({ data }) => {
                  if (isAuthenticatedUser(data.user)) setViewerUserId(data.user.id);
                })
                .catch(() => undefined);
            }

            if (isSupabaseConfigured && Object.keys(locallyOwnedJobs).length > 0) {'''))

          replacements.append((
          '''                isOwner={Boolean(ownedJobs[job.id])}''',
          '''                isOwner={Boolean(ownedJobs[job.id] || (viewerUserId && job.userId === viewerUserId))}'''))

          replacements.append((
          '''  async function deleteJob(job: JobListing) {
            const ownerKey = ownedJobs[job.id];
            if (!ownerKey) {
              alert("Only the device that posted this job can delete it.");
              return;
            }

            const confirmed = confirm("Delete this post from LoadLink?");
            if (!confirmed) return;

            const { data, error } = await supabase.rpc("delete_job_listing", {
              p_job_id: job.id,
              p_owner_key: ownerKey,
            });

            if (error || data !== true) {
              alert("This post can only be deleted from the device that created it.");
              return;
            }

            const next = { ...ownedJobs };
            delete next[job.id];
            localStorage.setItem("loadlink-owned-job-keys", JSON.stringify(next));
            setOwnedJobs(next);
            fetchJobs();
          }''',
          '''  async function deleteJob(job: JobListing) {
            if (!isSupabaseConfigured) {
              alert("Deleting listings is temporarily unavailable. Please try again shortly.");
              return;
            }

            const { data: authData, error: authError } = await supabase.auth.getUser();
            if (authError || !isAuthenticatedUser(authData.user)) {
              alert("Sign in with the account that posted this listing to delete it.");
              return;
            }

            const confirmed = confirm("Delete this post from LoadLink?");
            if (!confirmed) return;

            const ownerKey = ownedJobs[job.id] || "";
            const { data, error } = await supabase.rpc("delete_job_listing", {
              p_job_id: job.id,
              p_owner_key: ownerKey,
            });

            if (error || data !== true) {
              alert("Only the account that posted this listing can delete it.");
              return;
            }

            const next = { ...ownedJobs };
            delete next[job.id];
            localStorage.setItem("loadlink-owned-job-keys", JSON.stringify(next));
            setOwnedJobs(next);
            fetchJobs();
          }'''))

          replacements.append((
          '''      {editJob ? <EditJobModal job={editJob} ownerKey={ownedJobs[editJob.id]} onClose={() => setEditJob(null)} onUpdated={() => { setEditJob(null); fetchJobs(); }} /> : null}''',
          '''      {editJob ? <EditJobModal job={editJob} ownerKey={ownedJobs[editJob.id] || ""} onClose={() => setEditJob(null)} onUpdated={() => { setEditJob(null); fetchJobs(); }} /> : null}'''))

          replacements.append((
          '''      if (!isSupabaseConfigured || !ownerKey || job.id.startsWith("demo-")) {''',
          '''      if (!isSupabaseConfigured || job.id.startsWith("demo-")) {'''))

          replacements.append((
          '''      const { data, error } = await supabase.rpc("get_pro_job_analytics", { p_job_id: job.id, p_owner_key: ownerKey });''',
          '''      const { data, error } = await supabase.rpc("get_job_analytics", { p_job_id: job.id, p_owner_key: ownerKey });'''))

          replacements.append((
          '''      alert("This post can only be edited from the device that created it.");''',
          '''      alert("Only the account that posted this listing can edit it.");'''))

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "LoadLink Engineering"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add app/jobs/page.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git commit -m "Wire listing reports and ownership to account state"
          git push origin HEAD:main
