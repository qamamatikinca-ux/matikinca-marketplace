# Triggered to reconstruct the user's original supplied LoadLink artwork exactly.
name: Finalize exact LoadLink login artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-login-artwork.yml"

permissions:
  contents: write

concurrency:
  group: finalize-loadlink-login-artwork
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct original supplied artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/image-parts/login-hero-00.txt
          test -s .github/image-parts/login-hero-01.txt
          test -s .github/image-parts/login-hero-02.txt
          test -s .github/image-parts/login-hero-03.txt
          test -s .github/image-parts/login-hero-04.txt
          mkdir -p public/images
          cat \
            .github/image-parts/login-hero-00.txt \
            .github/image-parts/login-hero-01.txt \
            .github/image-parts/login-hero-02.txt \
            .github/image-parts/login-hero-03.txt \
            .github/image-parts/login-hero-04.txt \
            | tr -d '\n\r\t ' \
            | base64 --decode \
            > public/images/loadlink-login-hero-hd.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('public/images/loadlink-login-hero-hd.webp')
          data = p.read_bytes()
          if len(data) < 100_000:
              raise SystemExit(f'artwork unexpectedly small: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('reconstructed login artwork is not a WEBP file')
          print(f'validated WEBP: {len(data)} bytes')
          PY

      - name: Commit final binary and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/image-parts
          rm -f .github/workflows/finalize-login-artwork.yml
          git config user.name "qamamatikinca-ux"
          git config user.email "qamamatikinca@icloud.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize exact LoadLink login artwork"
          git push origin HEAD:main
