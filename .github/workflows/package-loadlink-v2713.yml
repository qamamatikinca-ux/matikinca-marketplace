name: Package LoadLink V2.7.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-loadlink-v2713.yml'

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Verify required fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'setLogisticsWorkspaceOpen(true)' app/messages/page.tsx
          grep -Fq 'if (selectedConversation && logisticsWorkspaceOpen)' app/messages/page.tsx
          if grep -Fq 'window.location.assign(`/tools?from=messages' app/messages/page.tsx; then
            echo 'ERROR: Logistics Tools still navigates to standalone /tools.' >&2
            exit 1
          fi
          grep -Fq 'if (mode === "checking") return null;' app/auth/mfa/page.tsx
          grep -Fq 'loadlink_security_code_status' lib/authSecurity.ts
          test ! -e .github/workflows/loadlink-v2712-route-tools.yml
          test ! -e .github/scripts/loadlink_v2712_route_tools.py

      - name: Build update-only package
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/LoadLink-V2.7.13-UPDATE-ONLY"
          mkdir -p "$PKG/app/messages" "$PKG/app/auth/mfa" "$PKG/app/auth/callback" "$PKG/components" "$PKG/lib"

          cp app/messages/page.tsx "$PKG/app/messages/page.tsx"
          cp app/messages/messages.module.css "$PKG/app/messages/messages.module.css"
          cp app/auth/mfa/page.tsx "$PKG/app/auth/mfa/page.tsx"
          cp app/auth/callback/page.tsx "$PKG/app/auth/callback/page.tsx"
          cp components/LogisticsMessageTools.tsx "$PKG/components/LogisticsMessageTools.tsx"
          cp components/AuthStatusButton.tsx "$PKG/components/AuthStatusButton.tsx"
          cp components/LoadLinkSiteHeader.tsx "$PKG/components/LoadLinkSiteHeader.tsx"
          cp lib/authSecurity.ts "$PKG/lib/authSecurity.ts"

          cat > "$PKG/DEPLOY_LOADLINK_V2_7_13.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          trap 'printf "\nDEPLOY FAILED at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR

          REPO="/workspaces/matikinca-marketplace"
          if [[ ! -d "$REPO/.git" ]]; then
            REPO="$(git rev-parse --show-toplevel 2>/dev/null || true)"
          fi
          if [[ -z "${REPO:-}" || ! -d "$REPO/.git" ]]; then
            echo "Could not find the matikinca-marketplace Git repository." >&2
            exit 1
          fi

          cd "$REPO"
          echo "== LoadLink V2.7.13: syncing exact main =="
          git fetch origin main
          git switch main
          git reset --hard origin/main

          echo "== Verifying the fixes before deployment =="
          grep -Fq 'setLogisticsWorkspaceOpen(true)' app/messages/page.tsx
          grep -Fq 'if (selectedConversation && logisticsWorkspaceOpen)' app/messages/page.tsx
          if grep -Fq 'window.location.assign(`/tools?from=messages' app/messages/page.tsx; then
            echo "Wrong Logistics Tools implementation detected. Deployment stopped." >&2
            exit 1
          fi
          grep -Fq 'if (mode === "checking") return null;' app/auth/mfa/page.tsx
          grep -Fq 'loadlink_security_code_status' lib/authSecurity.ts
          if [[ -e .github/workflows/loadlink-v2712-route-tools.yml || -e .github/scripts/loadlink_v2712_route_tools.py ]]; then
            echo "Old temporary Logistics Tools repair runner still exists. Deployment stopped." >&2
            exit 1
          fi

          VC=(npx --yes vercel@latest)

          echo "== Linking ONLY the main LoadLink Vercel project =="
          "${VC[@]}" link --yes --project matikinca-marketplace --scope loadlink

          echo "== Pulling production project settings/environment =="
          "${VC[@]}" pull --yes --environment=production --scope loadlink

          echo "== Installing exact dependencies =="
          rm -rf node_modules .next .vercel/output
          npm ci

          echo "== Building production locally for Vercel =="
          "${VC[@]}" build --prod --yes --scope loadlink

          echo "== Uploading the PREBUILT production build =="
          DEPLOYMENT_URL="$("${VC[@]}" deploy --prebuilt --prod --archive=tgz --yes --scope loadlink)"

          echo
          echo "=============================================="
          echo "LOADLINK V2.7.13 DEPLOYED"
          echo "Deployment: $DEPLOYMENT_URL"
          echo "Main site:   https://matikinca-marketplace.vercel.app"
          echo "Commit:      $(git rev-parse --short HEAD)"
          echo "=============================================="
          EOF
          sed -i 's/^          //' "$PKG/DEPLOY_LOADLINK_V2_7_13.sh"
          chmod +x "$PKG/DEPLOY_LOADLINK_V2_7_13.sh"
          bash -n "$PKG/DEPLOY_LOADLINK_V2_7_13.sh"

          cat > "$PKG/README.txt" <<'EOF'
          LOADLINK V2.7.13 — UPDATE ONLY

          This package contains the current validated source files for:
          - In-chat Logistics Tools takeover. The tools remain inside Messages and replace the chat surface while open.
          - The + button remains the attachment/actions menu.
          - Security-code routing: accounts without an enabled 4-digit code do not see the MFA page.
          - MFA checking state renders nothing until the code status is confirmed.
          - Duplicate callback loader removed.
          - Auth header does not display a fake account/sign-in control while session state is unresolved.
          - Shared LoadLink header source included.

          DEPLOYMENT
          Run DEPLOY_LOADLINK_V2_7_13.sh from a Codespace terminal, or use the exact terminal block supplied in ChatGPT.
          The deployment script deliberately links to the Vercel project named matikinca-marketplace under the loadlink scope and uses a locally prebuilt production deployment.
          EOF
          sed -i 's/^          //' "$PKG/README.txt"

          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/LoadLink-V2.7.13-UPDATE-ONLY.zip" "LoadLink-V2.7.13-UPDATE-ONLY"

      - name: Upload update-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LoadLink-V2.7.13-UPDATE-ONLY
          path: LoadLink-V2.7.13-UPDATE-ONLY.zip
          if-no-files-found: error
          retention-days: 14

# packaging trigger v2
