name: Deploy LoadLink primary from prebuilt output

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-loadlink-prebuilt-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Vercel token
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Link primary LoadLink project locally
        run: npx --yes vercel@latest link --yes --project matikinca-marketplace --scope loadlink --token "$VERCEL_TOKEN"

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --scope loadlink --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx --yes vercel@latest build --prod --yes --scope loadlink --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to primary production
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --scope loadlink --token "$VERCEL_TOKEN"

      - name: Upload prebuilt output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-primary-vercel-output
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

