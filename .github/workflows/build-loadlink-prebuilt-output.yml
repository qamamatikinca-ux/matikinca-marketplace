name: Deploy LoadLink primary from prebuilt output

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-loadlink-prebuilt-output.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ltBsujLbhqOPqX4dlpWDHial
      VERCEL_PROJECT_ID: prj_3qeAZGhTEQcQUtFQm9r70suN1Xzt
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Vercel token
        id: token
        continue-on-error: true
        shell: bash
        run: test -n "${VERCEL_TOKEN:-}"

      - name: Install dependencies
        id: install
        if: steps.token.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Bind primary LoadLink Vercel project
        id: link
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_3qeAZGhTEQcQUtFQm9r70suN1Xzt","orgId":"team_ltBsujLbhqOPqX4dlpWDHial","projectName":"matikinca-marketplace"}' > .vercel/project.json
          node -e 'const p=require("./.vercel/project.json"); if(p.projectId!==process.env.VERCEL_PROJECT_ID||p.orgId!==process.env.VERCEL_ORG_ID) process.exit(1)'

      - name: Pull production environment
        id: pull
        if: steps.link.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-pull.log

      - name: Build Vercel prebuilt output
        id: build
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest build --prod --yes --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-build.log

      - name: Deploy prebuilt output to primary production
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --yes --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1 || true)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          test -n "$DEPLOY_URL"

      - name: Verify production routes
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /dev/null https://matikinca-marketplace.vercel.app/login
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /tmp/login-hero.webp https://matikinca-marketplace.vercel.app/images/loadlink-login-hero-final.webp
          test "$(wc -c < /tmp/login-hero.webp | tr -d ' ')" = "136014"
          test "$(sha256sum /tmp/login-hero.webp | awk '{print $1}')" = "aa8633917fc45b724cb82c92f3d7281a29aa4ef20d487744942467867926a6cd"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /dev/null 'https://matikinca-marketplace.vercel.app/list-your-vehicle?entry=vehicle'
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /dev/null 'https://matikinca-marketplace.vercel.app/list-your-vehicle?entry=mobile-unit'

      - name: Write release receipt
        if: always()
        shell: bash
        run: |
          mkdir -p .github/release-status
          PULL_LOG="$(test -f /tmp/vercel-pull.log && tail -c 3500 /tmp/vercel-pull.log | base64 -w0 || true)"
          BUILD_LOG="$(test -f /tmp/vercel-build.log && tail -c 3500 /tmp/vercel-build.log | base64 -w0 || true)"
          DEPLOY_LOG="$(test -f /tmp/vercel-deploy.log && tail -c 3500 /tmp/vercel-deploy.log | base64 -w0 || true)"
          cat > .github/release-status/latest.txt <<EOF
          source_commit=${GITHUB_SHA}
          token=${{ steps.token.outcome }}
          install=${{ steps.install.outcome }}
          link=${{ steps.link.outcome }}
          pull=${{ steps.pull.outcome }}
          build=${{ steps.build.outcome }}
          deploy=${{ steps.deploy.outcome }}
          verify=${{ steps.verify.outcome }}
          deployment_url=${{ steps.deploy.outputs.url }}
          login_artwork_sha256=aa8633917fc45b724cb82c92f3d7281a29aa4ef20d487744942467867926a6cd
          pull_log_b64=${PULL_LOG}
          build_log_b64=${BUILD_LOG}
          deploy_log_b64=${DEPLOY_LOG}
          EOF

      - name: Commit release receipt
        if: always()
        shell: bash
        run: |
          git config user.name "LoadLink Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/release-status/latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record LoadLink production release result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload prebuilt output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-primary-vercel-output
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce release result
        if: always()
        shell: bash
        run: |
          test "${{ steps.token.outcome }}" = "success"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.link.outcome }}" = "success"
          test "${{ steps.pull.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.deploy.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"

# Verified login artwork + Vehicle & Units interaction release — 2026-08-21 09:39 SAST.
