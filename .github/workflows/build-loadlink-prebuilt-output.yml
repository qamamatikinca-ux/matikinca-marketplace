name: Build LoadLink prebuilt output

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-loadlink-prebuilt-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel token availability
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_PRESENT=yes"
          else
            echo "VERCEL_TOKEN_PRESENT=no"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Link b4sf project locally
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {
            "orgId": "team_ltBsujLbhqOPqX4dlpWDHial",
            "projectId": "prj_vkKr08egoWmA7XCmUKruj2zjiBi4"
          }
          JSON

      - name: Build Vercel prebuilt output
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx --yes vercel@latest build --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to b4sf production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Upload prebuilt output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-b4sf-vercel-output
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
