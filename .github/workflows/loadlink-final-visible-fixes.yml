name: LoadLink final visible fixes

on:
  push:
    paths:
      - '.github/workflows/loadlink-final-visible-fixes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested fixes
        run: python3 .github/loadlink-final-visible-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Production build check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "LoadLink Release Bot"
          git config user.email "loadlink-release@users.noreply.github.com"
          git add app/page.tsx app/loadlink-search-glass.css app/tools/truck-finance/page.tsx app/messages/page.tsx app/list-your-vehicle/page.tsx components/MarketplaceDiscovery.tsx components/SouthAfricaLocationInput.tsx components/SiteMenu.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply requested final visible LoadLink fixes [primary-only]"
          git push origin HEAD:main
