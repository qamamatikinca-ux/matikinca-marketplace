name: Install LoadLink Professional Release FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadlink-professional-install-final
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find and unpack the LoadLink release
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 1 -type f             -iname 'LoadLink-Professional-Marketplace-Update*.zip'             -print -quit)"

          if [ -z "${ARCHIVE}" ]; then
            echo "::error::The LoadLink professional update ZIP is missing from the repository root."
            echo "::error::Upload LoadLink-Professional-Marketplace-Update.zip beside package.json and rerun this workflow."
            exit 1
          fi

          rm -rf .loadlink-release-stage
          mkdir -p .loadlink-release-stage
          unzip -q "${ARCHIVE}" -d .loadlink-release-stage

          RELEASE_DIR="$(find .loadlink-release-stage             -mindepth 1 -maxdepth 1 -type d             -name 'LoadLink-Professional-Marketplace-Update*'             -print -quit)"

          if [ -z "${RELEASE_DIR}" ]; then
            echo "::error::The ZIP does not contain the expected LoadLink-Professional-Marketplace-Update folder."
            exit 1
          fi

          for REQUIRED in             package.json             package-lock.json             scripts/clean-legacy-source.mjs             scripts/validate-recommendations.mjs             scripts/syntax-check.mjs             scripts/sql-integrity.mjs             scripts/performance-budget.mjs             tests/marketplace-contracts.test.mjs             supabase/migrations/20260801_000001_loadlink_professional_marketplace.sql; do
            if [ ! -f "${RELEASE_DIR}/${REQUIRED}" ]; then
              echo "::error::The release ZIP is incomplete. Missing: ${REQUIRED}"
              exit 1
            fi
          done

          rsync -a "${RELEASE_DIR}/" ./ --exclude '.git/'
          echo "The professional release files were copied successfully."

      - name: Install project dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev --no-audit --no-fund

      - name: Remove known legacy repair artifacts
        run: node scripts/clean-legacy-source.mjs

      - name: Validate all 140 recommendations
        run: node scripts/validate-recommendations.mjs

      - name: Validate marketplace and security contracts
        run: node --test tests/*.test.mjs

      - name: Validate TypeScript syntax
        run: node scripts/syntax-check.mjs

      - name: Validate ordered SQL migration
        run: node scripts/sql-integrity.mjs

      - name: Validate asset budget
        run: node scripts/performance-budget.mjs

      - name: Remove temporary and duplicate installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .loadlink-release-stage
          find . -maxdepth 1 -type f             -iname 'LoadLink-Professional-Marketplace-Update*.zip'             -delete

          rm -f             ".github/workflows/install-loadlink-professional-release.yml"             ".github/workflows/install-loadlink-professional-release 2.yml"             ".github/workflows/install-loadlink-professional-release 3.yml"             ".github/workflows/install-loadlink-professional-release-FIXED.yml"             ".github/workflows/install-loadlink-professional-release-final.yml"

      - name: Commit the professional release
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "LoadLink Release Installer"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes were detected."
            exit 0
          fi

          git commit -m "Install LoadLink professional marketplace release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
