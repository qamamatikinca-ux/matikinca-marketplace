name: LoadLink V2.7.10 Tools Replace Chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loadlink-v2710-tools-replace-chat.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply tools replacement fix
        run: python3 scripts/loadlink_v2710_tools_replace_chat.py

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/messages/page.tsx components/LogisticsMessageTools.tsx
          git commit -m "LoadLink V2.7.10: replace chat with logistics tools workspace"
          git push origin HEAD:main
