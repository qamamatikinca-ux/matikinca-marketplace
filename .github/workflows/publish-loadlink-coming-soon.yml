name: Publish LoadLink Coming Soon

on:
  push:
    branches:
      - main
    paths:
      - "deploy/coming-soon-preview-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-loadlink-coming-soon
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish isolated Coming Soon preview
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      VERCEL_SCOPE: loadlink
      VERCEL_PROJECT: matikinca-marketplace

    steps:
      - name: Checkout latest Coming Soon branch
        uses: actions/checkout@v4
        with:
          ref: loadlink-coming-soon
          fetch-depth: 1

      - name: Confirm selected-trial source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q "Your business has been selected for complimentary LoadLink access" app/page.tsx
          grep -q "Follow the build" app/page.tsx
          grep -q "INSTAGRAM_URL" app/page.tsx
          grep -q "LINKEDIN_URL" app/page.tsx
          test -f app/template.tsx
          test -f public/images/linkedin-badge.png
          test -f public/images/instagram-badge.jpeg
          echo "Coming Soon source verification: PASS"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link primary project in preview mode
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .vercel
          vercel link --yes --project="$VERCEL_PROJECT" --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"
          vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build preview on GitHub runner
        run: vercel build --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt preview
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment: $DEPLOY_URL"

      - name: Try short LoadLink alias
        id: alias
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -Eeuo pipefail
          SHORT_URL=""
          for ALIAS in loadlink-sa.vercel.app loadlink-soon.vercel.app loadlinkcoming.vercel.app; do
            if vercel alias set "$DEPLOY_URL" "$ALIAS" --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"; then
              SHORT_URL="https://$ALIAS"
              break
            fi
          done
          echo "short_url=$SHORT_URL" >> "$GITHUB_OUTPUT"
          echo "Short URL: ${SHORT_URL:-not-assigned}"

      - name: Summary
        if: always()
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
          SHORT_URL: ${{ steps.alias.outputs.short_url }}
        run: |
          {
            echo "## LoadLink Coming Soon Preview"
            echo ""
            echo "- Source branch: loadlink-coming-soon"
            echo "- Vercel project: matikinca-marketplace"
            echo "- Deployment URL: ${DEPLOY_URL:-not-created}"
            echo "- Short URL: ${SHORT_URL:-not-assigned}"
          } >> "$GITHUB_STEP_SUMMARY"
