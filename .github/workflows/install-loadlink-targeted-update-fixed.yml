      - name: Verify targeted update contract
        shell: bash
        run: |
          set -euo pipefail
          test -f 'app/list-your-vehicle/page.tsx'
          grep -q 'SAFETY_MAXIMUM_LOADING_TIME' components/GlobalLoading.tsx
          grep -q 'snap-mandatory' components/LoadLinkCommercialDealership.tsx
          grep -q 'Swipe products' 'app/dealership/[slug]/page.tsx'
          grep -q 'Create dealership post' app/dealer/page.tsx
          grep -q 'loadlink-messages' app/messages/page.tsx
          grep -q 'createPortal' components/SiteMenu.tsx
          grep -Fq 'const trailerTypes = ["Flatbed"' app/list-your-vehicle/page.tsx
          grep -Fq 'const mobileUnitTypes = ["Mobile Toilet"' app/list-your-vehicle/page.tsx
          grep -q 'savePreference' app/account/settings/page.tsx
          grep -q 'const f=file as File' app/dealer/page.tsx
          grep -Fq 'as File[]' app/list-your-vehicle/page.tsx
          if grep -RIn --include='*.ts' --include='*.tsx' 'List Your Truck' app components lib; then
            echo 'Old List Your Truck wording remains.'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript validation
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee "$RUNNER_TEMP/loadlink-typescript.log"

      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/loadlink-build.log"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-targeted-fixed-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/loadlink-typescript.log
            ${{ runner.temp }}/loadlink-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and deploy update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'app/layout.tsx' 'app/globals.css' 'app/account/packages/page.tsx' 'app/account/settings/page.tsx' 'app/dealer/page.tsx' 'app/dealership/[slug]/page.tsx' 'app/list-your-truck/page.tsx' 'app/list-your-vehicle/page.tsx' 'app/messages/page.tsx' 'app/my-posts/page.tsx' 'app/page.tsx' 'components/BusinessPlans.tsx' 'components/ChatLauncher.tsx' 'components/GlobalLoading.tsx' 'components/LoadLinkCommercialDealership.tsx' 'components/MarketplaceDiscovery.tsx' 'components/SiteMenu.tsx' 'components/ThemeCoordinator.tsx'
          if git diff --cached --quiet; then
            echo "The corrected targeted update is already installed."
          else
            git commit -m "Install fixed LoadLink dealership, messages and vehicle update"
            git push origin main
          fi
