name: LoadLink visible UI fix v2.7.4

'on':
  push:
    paths:
      - .github/workflows/loadlink-visible-ui-fix-v274.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visible UI corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              print(path, old[:70], 'matches', n)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(s.replace(old, new, 1))

          # HOME: make portal sections visibly shorter without changing the image crop.
          replace(
              'app/page.tsx',
              'className="group relative block h-[52vh] min-h-[380px] w-full overflow-hidden md:h-[65vh]"',
              'className="group relative block h-[330px] min-h-[330px] w-full overflow-hidden sm:h-[360px] md:h-[420px] md:min-h-[420px]"'
          )

          # HOME: undo the background-size treatment that changed how the photos looked.
          replace(
              'app/page.tsx',
              '''                <div
        aria-hidden="true"
        className="absolute inset-0 bg-cover bg-fixed transition duration-700 group-hover:scale-[1.02]"
        style={{ backgroundImage: `url(${activeImage.src})`, backgroundPosition: activeImage.position }}
      />''',
              '''                <img
                  src={activeImage.src}
                  alt=""
                  aria-hidden="true"
                  style={{ objectPosition: activeImage.position }}
                  className="absolute inset-0 h-full w-full object-cover object-center transition duration-700 group-hover:scale-[1.01]"
                />'''
          )

          # HOME: portal call-to-action pills were still visually oversized.
          replace(
              'app/page.tsx',
              'min-h-[64px] w-[min(78vw,470px)] items-center justify-center rounded-full border px-6 py-3.5 text-[16px]',
              'min-h-[50px] w-[min(72vw,390px)] items-center justify-center rounded-full border px-5 py-2.5 text-[14px]'
          )
          replace(
              'app/page.tsx',
              'md:min-h-[72px] md:w-[min(50vw,500px)] md:px-8 md:py-4 md:text-[18px]',
              'md:min-h-[58px] md:w-[min(42vw,430px)] md:px-7 md:py-3 md:text-[16px]'
          )

          # MARKETPLACE tabs: compact enough to read as controls, not large cards.
          replace(
              'components/MarketplaceDiscovery.tsx',
              'min-h-[46px] min-w-[104px] shrink-0 rounded-full border px-5 py-2.5 text-sm',
              'min-h-[40px] min-w-[86px] shrink-0 rounded-full border px-4 py-2 text-[13px]'
          )

          # LIST YOUR VEHICLE: make the opening hero follow the Driver Portal interaction hierarchy.
          replace(
              'app/list-your-vehicle/page.tsx',
              'Find a vehicle or list your own',
              'Find a vehicle or list your own'
          )
          old = '''          {!dealerPost ? (
  <div className="mx-auto mt-6 grid w-full max-w-md gap-3">
    <button type="button" onClick={() => {
      setListingIntent("vehicle");
      setVehicleCategory(null);
      setListingFlowOpen(true);
      setSelectedPlan(null);
      setPackageType("standard");
      window.setTimeout(() => document.getElementById("vehicle-listing-form")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
    }} className="flex min-h-14 items-center justify-center rounded-full bg-[#f6b800] px-6 text-sm font-black uppercase tracking-[.1em] text-black shadow-[0_12px_32px_rgba(0,0,0,.28)] transition active:scale-[.99]">
      List your vehicle
    </button>
    <button type="button" onClick={() => {
      setListingIntent("mobile_unit");
      setVehicleCategory("mobile_unit");
      setListingFlowOpen(true);
      setSelectedPlan(null);
      setPackageType("standard");
      window.setTimeout(() => document.getElementById("vehicle-listing-form")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
    }} className="flex min-h-14 items-center justify-center rounded-full border border-white/55 bg-black/80 px-6 text-sm font-black uppercase tracking-[.1em] text-white shadow-[0_12px_32px_rgba(0,0,0,.24)] backdrop-blur transition active:scale-[.99]">
      List a mobile unit
    </button>
    <a href="#vehicle-marketplace-vehicles" onClick={() => { setListingFlowOpen(false); setListingIntent(null); }} className="flex min-h-12 items-center justify-center rounded-full border border-white/35 bg-black/55 px-6 text-xs font-black uppercase tracking-[.1em] text-white/85 backdrop-blur transition active:scale-[.99]">
      Browse available stock
    </a>
  </div>
) : null}'''
          new = '''          {!dealerPost ? (
            <div className="mx-auto mt-6 grid w-full max-w-md gap-3">
              <a
                href="#vehicle-marketplace-vehicles"
                onClick={() => { setListingFlowOpen(false); setListingIntent(null); }}
                className="flex min-h-14 items-center justify-center rounded-full bg-[#f6b800] px-6 text-sm font-black uppercase tracking-[.1em] text-black shadow-[0_12px_32px_rgba(0,0,0,.28)] transition active:scale-[.99]"
              >
                View available vehicles
              </a>
              <button
                type="button"
                onClick={() => {
                  setListingIntent("vehicle");
                  setVehicleCategory(null);
                  setListingFlowOpen(true);
                  setSelectedPlan(null);
                  setPackageType("standard");
                  window.setTimeout(() => document.getElementById("vehicle-listing-form")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
                }}
                className="flex min-h-14 items-center justify-center rounded-full border border-white/55 bg-black/80 px-6 text-sm font-black uppercase tracking-[.1em] text-white shadow-[0_12px_32px_rgba(0,0,0,.24)] backdrop-blur transition active:scale-[.99]"
              >
                List your vehicle
              </button>
              <button
                type="button"
                onClick={() => {
                  setListingIntent("mobile_unit");
                  setVehicleCategory("mobile_unit");
                  setListingFlowOpen(true);
                  setSelectedPlan(null);
                  setPackageType("standard");
                  window.setTimeout(() => document.getElementById("vehicle-listing-form")?.scrollIntoView({ behavior: "smooth", block: "start" }), 40);
                }}
                className="flex min-h-14 items-center justify-center rounded-full border border-white/55 bg-black/80 px-6 text-sm font-black uppercase tracking-[.1em] text-white shadow-[0_12px_32px_rgba(0,0,0,.24)] backdrop-blur transition active:scale-[.99]"
              >
                List a mobile unit
              </button>
            </div>
          ) : null}'''
          replace('app/list-your-vehicle/page.tsx', old, new)

          # Do not expose the Plan Guide before a listing intent is selected.
          # Existing intent gate remains authoritative; make the seller chooser part of the chosen flow only.
          if 'listingFlowOpen && signedIn && listingIntent && !selectedPlan ? <BusinessPlans' not in Path('app/list-your-vehicle/page.tsx').read_text():
              raise SystemExit('Plan Guide intent gate is missing')

          # SEEN post badge: the vehicle marketplace card itself is clickable, so photo and Full details both persist Seen.
          hub = Path('components/VehicleMarketplaceHub.tsx').read_text()
          required = ['const SEEN_KEY = "loadlink-seen-vehicle-listings-v1";', 'onClick={() => markSeen(String(row.id))}', '>Seen</span>']
          for needle in required:
              if needle not in hub:
                  raise SystemExit(f'Missing Seen post behavior: {needle}')

          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build check
        run: npm ci && npm run build
      - name: Commit corrected UI
        shell: bash
        run: |
          rm -f .github/workflows/loadlink-visible-ui-fix-v274.yml
          git config user.name "LoadLink Maintenance"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add app/page.tsx app/list-your-vehicle/page.tsx components/MarketplaceDiscovery.tsx .github/workflows/loadlink-visible-ui-fix-v274.yml
          git commit -m "Make LoadLink portal corrections visibly apply"
          git push origin HEAD:main
