name: LoadLink V2.7.6 Recovery

on:
  push:
    branches:
      - recovery/v276

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[v276-applied]') }}
    runs-on: ubuntu-latest
    env:
      BASE_SHA: f076516e068f860e867c8043899e9f2bb5b62db0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply V2.7.6 recovery patch
        run: python3 scripts/loadlink-v276-recovery.py

      - name: Install dependencies
        run: npm ci

      - name: Production build validation
        run: npm run build

      - name: Commit validated recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/loadlink-v276-recovery.py .github/workflows/loadlink-v276-recovery.yml
          git add -A
          git commit -m '[v276-applied] LoadLink V2.7.6 precision recovery'
          git push origin HEAD:recovery/v276

      - name: Create update-only zip
        run: |
          git diff --name-only "$BASE_SHA"..HEAD | grep -E '^(app|components|lib)/' > /tmp/v276-files.txt
          echo '=== UPDATE FILES ==='
          cat /tmp/v276-files.txt
          test -s /tmp/v276-files.txt
          zip -9 LoadLink-V2.7.6-UPDATE-ONLY.zip -@ < /tmp/v276-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LoadLink-V2.7.6-UPDATE-ONLY
          path: LoadLink-V2.7.6-UPDATE-ONLY.zip
          retention-days: 7
