name: Install LoadLink Targeted Update Final

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-targeted-update-final
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify LoadLink baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/page.tsx
          test -f app/layout.tsx
          test -f components/LoadLinkLoading.tsx
          test -f app/dealer/page.tsx
          test -f app/messages/page.tsx

      - name: Create rollback branch and backup artifact
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_BRANCH="backup/loadlink-before-targeted-final-${{ github.run_id }}"
          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-targeted-fixed.zip" HEAD

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-targeted-final-${{ github.run_id }}
          path: ${{ runner.temp }}/loadlink-before-targeted-fixed.zip
          retention-days: 30

      - name: Apply final targeted update
