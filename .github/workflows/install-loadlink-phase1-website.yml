name: Install LoadLink Phase 1 Website

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run npm install/build before committing"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: install-loadlink-phase1-website
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify installer packages
        shell: bash
        run: |
          set -euo pipefail

          PART1="LoadLink-Phase1-Website-Part-1.zip"
          PART2="LoadLink-Phase1-Website-Part-2.zip"

          test -f "$PART1" || {
            echo "::error::Missing $PART1 in the repository root."
            exit 1
          }

          test -f "$PART2" || {
            echo "::error::Missing $PART2 in the repository root."
            exit 1
          }

          unzip -t "$PART1"
          unzip -t "$PART2"

      - name: Create pre-install backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loadlink-backup"

          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='LoadLink-Phase1-Website-Part-1.zip' \
            --exclude='LoadLink-Phase1-Website-Part-2.zip' \
            ./ "$RUNNER_TEMP/loadlink-backup/"

          tar -czf "$RUNNER_TEMP/loadlink-website-before-phase1.tar.gz" \
            -C "$RUNNER_TEMP/loadlink-backup" .

      - name: Upload pre-install backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-website-before-phase1
          path: ${{ runner.temp }}/loadlink-website-before-phase1.tar.gz
          retention-days: 30

      - name: Extract and merge both website parts
        shell: bash
        run: |
          set -euo pipefail

          PART1="LoadLink-Phase1-Website-Part-1.zip"
          PART2="LoadLink-Phase1-Website-Part-2.zip"
          WORK="$RUNNER_TEMP/loadlink-phase1-website"

          rm -rf "$WORK"
          mkdir -p "$WORK/part1" "$WORK/part2" "$WORK/staging"

          unzip -q "$PART1" -d "$WORK/part1"
          unzip -q "$PART2" -d "$WORK/part2"

          find_source_root() {
            local dir="$1"
            local count
            count="$(find "$dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"

            if [ "$count" = "1" ]; then
              local only
              only="$(find "$dir" -mindepth 1 -maxdepth 1 | head -n 1)"
              if [ -d "$only" ]; then
                printf '%s\n' "$only"
                return
              fi
            fi

            printf '%s\n' "$dir"
          }

          ROOT1="$(find_source_root "$WORK/part1")"
          ROOT2="$(find_source_root "$WORK/part2")"

          rsync -a "$ROOT1/" "$WORK/staging/"
          rsync -a "$ROOT2/" "$WORK/staging/"

          test -n "$(find "$WORK/staging" -mindepth 1 -maxdepth 2 -print -quit)" || {
            echo "::error::The merged website package is empty."
            exit 1
          }

      - name: Install Phase 1 website files safely
        shell: bash
        run: |
          set -euo pipefail

          STAGING="$RUNNER_TEMP/loadlink-phase1-website/staging"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='LoadLink-Phase1-Website-Part-1.zip' \
            --exclude='LoadLink-Phase1-Website-Part-2.zip' \
            "$STAGING/" ./

          rm -f \
            "LoadLink-Phase1-Website-Part-1.zip" \
            "LoadLink-Phase1-Website-Part-2.zip"

      - name: Confirm critical website files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json is missing after installation."
            exit 1
          }

          if [ ! -d app ] && [ ! -d pages ] && [ ! -d src ]; then
            echo "::error::No Next.js application directory was found."
            exit 1
          fi

          echo "Website package installed into the repository workspace."

      - name: Optional dependency and production build check
        if: ${{ inputs.run_build }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi

          npm run build

      - name: Commit installed website update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "LoadLink Phase 1 Installer"
          git config user.email "loadlinksouthafrica@gmail.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes were detected."
            exit 0
          fi

          git commit -m "Install LoadLink Phase 1 website core"
          git push

      - name: Installation summary
        shell: bash
        run: |
          {
            echo "## LoadLink Phase 1 Website"
            echo ""
            echo "- Both website ZIP parts were validated and merged."
            echo "- Existing .env files and GitHub workflows were preserved."
            echo "- The installer ZIP files were removed before commit."
            echo "- A pre-install backup was uploaded as a workflow artifact."
            echo "- Build check requested: ${{ inputs.run_build }}"
          } >> "$GITHUB_STEP_SUMMARY"
