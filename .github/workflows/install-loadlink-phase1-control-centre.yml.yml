name: Install LoadLink Phase 1 Control Centre

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run dependency install and production build before committing"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: install-loadlink-phase1-control-centre
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Control Centre repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Control Centre package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="LoadLink-Phase1-Control-Centre.zip"
          test -f "$PACKAGE" || {
            echo "::error::Missing $PACKAGE in the repository root."
            exit 1
          }
          unzip -t "$PACKAGE"

      - name: Create pre-install backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loadlink-backup"
          rsync -a             --exclude='.git/'             --exclude='node_modules/'             --exclude='.next/'             --exclude='LoadLink-Phase1-Control-Centre.zip'             ./ "$RUNNER_TEMP/loadlink-backup/"
          tar -czf "$RUNNER_TEMP/loadlink-control-centre-before-phase1.tar.gz"             -C "$RUNNER_TEMP/loadlink-backup" .

      - name: Upload pre-install backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-control-centre-before-phase1
          path: ${{ runner.temp }}/loadlink-control-centre-before-phase1.tar.gz
          retention-days: 30

      - name: Extract Control Centre package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="LoadLink-Phase1-Control-Centre.zip"
          WORK="$RUNNER_TEMP/loadlink-phase1-control-centre"
          rm -rf "$WORK"
          mkdir -p "$WORK/extracted"
          unzip -q "$PACKAGE" -d "$WORK/extracted"

          SOURCE="$WORK/extracted"

          while true; do
            entries="$(find "$SOURCE" -mindepth 1 -maxdepth 1               ! -name '__MACOSX'               ! -name '.DS_Store')"
            count="$(printf '%s
' "$entries" | sed '/^$/d' | wc -l | tr -d ' ')"

            if [ "$count" = "1" ]; then
              only="$(printf '%s
' "$entries" | head -n 1)"
              if [ -d "$only" ]; then
                SOURCE="$only"
                continue
              fi
            fi

            break
          done

          printf '%s
' "$SOURCE" > "$WORK/source-root.txt"

          test -n "$(find "$SOURCE" -mindepth 1 -maxdepth 3 -print -quit)" || {
            echo "::error::The Control Centre package is empty."
            exit 1
          }

          echo "Detected package root: $SOURCE"
          find "$SOURCE" -maxdepth 2 -type f | head -n 40

      - name: Install Phase 1 Control Centre safely
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/loadlink-phase1-control-centre"
          SOURCE="$(cat "$WORK/source-root.txt")"

          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='.env'             --exclude='.env.*'             --exclude='node_modules/'             --exclude='.next/'             --exclude='LoadLink-Phase1-Control-Centre.zip'             "$SOURCE/" ./

          rm -f "LoadLink-Phase1-Control-Centre.zip"

      - name: Confirm critical Control Centre files
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(find . -maxdepth 4 -type f -name package.json             ! -path './node_modules/*'             ! -path './.git/*'             | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::No package.json was found after installation."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          APP_ROOT="$(dirname "$PACKAGE_JSON")"
          echo "Detected application root: $APP_ROOT"

          if [ ! -d "$APP_ROOT/app" ] &&              [ ! -d "$APP_ROOT/pages" ] &&              [ ! -d "$APP_ROOT/src" ]; then
            echo "::warning::No app, pages, or src directory found beside package.json."
            echo "Installation will continue because this project may use a custom structure."
          fi

          logo_matches="$(find "$APP_ROOT" -maxdepth 6 -type f             \( -iname '*loadlink*.png'             -o -iname '*loadlink*.jpg'             -o -iname '*loadlink*.jpeg'             -o -iname '*loadlink*.webp'             -o -iname '*logo*.png'             -o -iname '*logo*.jpg'             -o -iname '*logo*.jpeg'             -o -iname '*logo*.webp'             -o -iname '*favicon*' \)             ! -path '*/node_modules/*'             2>/dev/null | wc -l | tr -d ' ')"

          echo "Potential logo assets found: $logo_matches"
          echo "$APP_ROOT" > "$RUNNER_TEMP/loadlink-app-root.txt"

      - name: Optional dependency and production build check
        if: ${{ inputs.run_build }}
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$(cat "$RUNNER_TEMP/loadlink-app-root.txt")"
          cd "$APP_ROOT"

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi

          npm run build

      - name: Commit installed Control Centre update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LoadLink Phase 1 Installer"
          git config user.email "loadlinksouthafrica@gmail.com"
          git add -A

          if git diff --cached --quiet; then
            echo "::warning::No repository changes were detected."
            exit 0
          fi

          git commit -m "Install LoadLink Phase 1 Control Centre core"
          git push

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LoadLink Phase 1 Control Centre"
            echo ""
            echo "- ZIP validation completed."
            echo "- Existing .env files and GitHub workflows were preserved."
            echo "- Nested project folders are supported."
            echo "- A pre-install backup was uploaded as a workflow artifact."
            echo "- Build check requested: ${{ inputs.run_build }}"
          } >> "$GITHUB_STEP_SUMMARY"
