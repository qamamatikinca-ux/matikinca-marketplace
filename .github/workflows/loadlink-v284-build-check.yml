name: LoadLink V2.8.4 Build Check

on:
  push:
    branches:
      - loadlink-v284-consistency-fix-20260812

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
