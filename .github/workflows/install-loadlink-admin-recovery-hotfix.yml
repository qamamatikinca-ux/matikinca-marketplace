          tar -tzf "$RUNNER_TEMP/loadlink-admin-hotfix.tar.gz" > "$RUNNER_TEMP/loadlink-admin-hotfix-files.txt"
          if grep -E '(^|/)\.\.?(/|$)|(^|/)\.env|(^|/)node_modules(/|$)|(^|/)\.git(/|$)' "$RUNNER_TEMP/loadlink-admin-hotfix-files.txt"; then
            echo "Unsafe path found in hotfix payload."
            exit 1
          fi

          allowed='^(app/error\.tsx|app/layout\.tsx|app/admin/page\.tsx|app/admin/loading\.tsx|app/admin/error\.tsx|app/admin/verifications/page\.tsx|components/platform/GlobalEnhancers\.tsx)$'
          invalid=$(sed 's#/$##' "$RUNNER_TEMP/loadlink-admin-hotfix-files.txt" | grep -v '^app$' | grep -v '^app/admin$' | grep -v '^app/admin/verifications$' | grep -v '^components$' | grep -v '^components/platform$' | grep -Ev "$allowed" || true)
          if [ -n "$invalid" ]; then
            echo "Unexpected file in hotfix payload:"
            echo "$invalid"
            exit 1
          fi

      - name: Install admin recovery hotfix
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/loadlink-admin-hotfix.tar.gz" -C .

          test -f app/admin/page.tsx
          test -f app/admin/error.tsx
          test -f app/admin/loading.tsx
          test -f app/error.tsx
          test -f components/platform/GlobalEnhancers.tsx

          grep -q 'redirect("/admin/verifications")' app/admin/page.tsx
          grep -q 'isAdminRoute' components/platform/GlobalEnhancers.tsx
          grep -q 'GlobalEnhancers' app/layout.tsx
          grep -q 'Sign in with an authorised LoadLink admin account' app/admin/verifications/page.tsx

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript check
        shell: bash
        run: npx tsc --noEmit

      - name: Run production build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app components; then
            echo "The admin recovery hotfix is already installed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/error.tsx app/layout.tsx app/admin/page.tsx app/admin/loading.tsx app/admin/error.tsx app/admin/verifications/page.tsx components/platform/GlobalEnhancers.tsx
          git commit -m "Fix LoadLink admin route recovery"
          git push origin "HEAD:${{ github.ref_name }}"
