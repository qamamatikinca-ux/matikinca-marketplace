name: Install LoadLink Admin Recovery Hotfix

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-loadlink-admin-recovery-hotfix
  cancel-in-progress: false

jobs:
  repair-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current LoadLink website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify expected LoadLink project
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app/layout.tsx
          test -f app/global-error.tsx
          test -f app/admin/verifications/page.tsx
          test -f components/GlobalLoading.tsx
          test -f components/NotificationCenter.tsx
          test -f components/ChatLauncher.tsx

      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/loadlink-before-admin-recovery-hotfix.zip" HEAD

      - name: Upload rollback backup
        uses: actions/upload-artifact@v4
        with:
          name: loadlink-before-admin-recovery-hotfix
          path: ${{ runner.temp }}/loadlink-before-admin-recovery-hotfix.zip
          retention-days: 30

