name: Deploy Canonical Vercel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-canonical-vercel.yml'

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_ltBsujLbhqOPqX4dlpWDHial
  VERCEL_PROJECT_ID: prj_3qeAZGhTEQcQUtFQm9r70suN1Xzt

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN or VERCEL_ACCESS_TOKEN repository secret is available."
            exit 2
          fi
      - name: Deploy exact main tree to canonical production project
        run: npx --yes vercel@latest --prod --yes --token="$VERCEL_TOKEN"
